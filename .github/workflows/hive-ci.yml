name: HIVE CI

on:
  pull_request:
    paths:
      - 'apps/hive/**'
      - '.github/workflows/hive-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/hive/**'
      - '.github/workflows/hive-ci.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/hive

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/hive/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build HIVE
        run: npm run build
