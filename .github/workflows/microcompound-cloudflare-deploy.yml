name: Deploy Micro Compound Cloudflare Paper Worker
# Manually triggered only. No live trading, funding or fee-bearing service changes.
# Cloudflare Cron Triggers run inside the deployed Worker, NOT in GitHub Actions.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: microcompound-cloudflare-paper-deploy
  cancel-in-progress: false
jobs:
  deploy-paper-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Cloudflare is authorised through GitHub encrypted secrets
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CF_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }
          echo "Credentials found in encrypted GitHub secrets. Values will not be printed."

      - name: Validate paper-only script and fixed D1 configuration
        shell: bash
        run: |
          set -euo pipefail
          node --check experiments/micro-compound-agents/core.mjs
          node --check experiments/micro-compound-agents/cloudflare/worker.mjs
          node -e 'const c=require("./experiments/micro-compound-agents/cloudflare/wrangler.jsonc");if(c.name!=="micro-compound-paper-agents"||c.d1_databases?.[0]?.binding!=="DB"||c.d1_databases?.[0]?.database_name!=="microcompound-paper"||c.d1_databases?.[0]?.database_id==="REPLACE_WITH_CREATED_D1_DATABASE_UUID")process.exit(1);console.log("Safe separate Worker and D1 binding verified")'

      - name: Create missing paper ledger tables in existing D1 database
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: experiments/micro-compound-agents/cloudflare
          wranglerVersion: '4'
          command: d1 migrations apply DB --remote

      - name: Deploy separate paper-only Worker, read-only dashboard and scheduled cron triggers
        id: cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: experiments/micro-compound-agents/cloudflare
          wranglerVersion: '4'
          command: deploy

      - name: Summarise deployment
        env:
          DEPLOYMENT_URL: ${{ steps.cloudflare.outputs.deployment-url }}
        shell: bash
        run: |
          echo "Deployment URL: ${DEPLOYMENT_URL:-See previous Wrangler action step}"
          echo "Wait several minutes for one-minute cron trigger propagation."
          echo "Confirm GET /health, GET /api/status and the root dashboard before claiming trading research is running."
          echo "NO real Coinbase orders, transfers or payment authorisation."
