name: Micro Compound simulation tests
on:
  push:
    paths:
      - 'experiments/micro-compound/**'
      - '.github/workflows/micro-compound-ci.yml'
  pull_request:
    paths:
      - 'experiments/micro-compound/**'
      - '.github/workflows/micro-compound-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test experiments/micro-compound/tests/*.test.mjs
      - name: Run historical Coinbase replay verification (read-only)
        run: node --test experiments/micro-compound/research/tests/history-replay.test.mjs
